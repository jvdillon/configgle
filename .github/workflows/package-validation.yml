# DO NOT EDIT -- generated from package-validation.yml.tmpl and this
# package's sync config. Hand edits are overwritten; change
# the template, the generator, or the sync config instead.
name: Package validation

on:
  pull_request:
    branches: [main]
    paths:
      - "**"
  push:
    branches: [main]
    paths:
      - "**"

permissions:
  contents: read

concurrency:
  group: package-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep fd-find
      - name: Validate package
        run: |
          uv sync --all-groups
          uv run ruff check --no-fix --no-cache .
          uv run ruff format --check --no-cache .
          uv run codespell .
          uv run ty check
          uv run basedpyright configgle tests
          uv run pytest
          uv run python -c "import configgle"
          rm -rf dist
          uv build --out-dir dist
          wheel="$(ls dist/configgle-*.whl | head -n 1)"
          uv run --isolated --with "$wheel" python -c "import configgle; print(configgle.__file__)"
          uv run python bin/check_wheel.py
